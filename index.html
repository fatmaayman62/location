<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink - Auto Location Easy</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: right;
        }
        .address-box {
            background-color: #eff6ff;
            border: 2px dashed #2563eb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .payload-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #16a34a;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="card">
    <h3 style="margin-top: 0; color: #1e2937;">📡 تحديد العنوان أوتوماتيك</h3>
    <p style="font-size: 14px; color: #6b7280;">السيستم يلقط موقعك الحالي أوتوماتيك فور فتح الصفحة.</p>

    <div class="address-box">
        <strong>📍 مكانك الحالي (أوتوماتيك):</strong>
        <div id="cityName" style="color: #2563eb; font-weight: bold; margin-top: 5px;">جاري تشغيل الـ GPS...</div>
    </div>

    <div class="payload-box">
        📦 Payload for Backend:<br>
        <pre id="backendJson">{ "latitude": 0, "longitude": 0 }</pre>
    </div>
</div>

<script>
// دالة بتشتغل أوتوماتيك أول ما الصفحة تفتح
async function getAutomaticLocation() {
    let cityNameDiv = document.getElementById('cityName');
    let backendJsonDiv = document.getElementById('backendJson');

    // 1. إعدادات صارمة لطلب الـ GPS الحقيقي ومنع الكاش الكاذب
    const gpsOptions = {
        enableHighAccuracy: true, // تشغيل حساس الـ GPS الفعلي بأعلى دقة
        timeout: 10000,           // مهلة 10 ثواني للقط الإشارة
        maximumAge: 0             // تصفير الكاش (ممنوع استخدام موقع قديم)
    };

    // 2. طلب الموقع التلقائي من المتصفح
    navigator.geolocation.getCurrentPosition(
        async (position) => {
            // لو وافقتي على الإذن، هيلقط خطوط الطول والعرض فوراً
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;

            cityNameDiv.innerText = "جاري ترجمة الإحداثيات لاسم الشارع...";

            try {
                // 3. نبعت الإحداثيات للسيرفر عشان يترجمها لاسم شارع وقرية بالعربي
                let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ar`);
                let data = await response.json();

                let address = data.address || {};
                // نجمع اسم الشارع والقرية أو المركز
                let street = address.road || address.suburb || "";
                let city = address.village || address.town || address.city || "";
                let fullAddress = [street, city].filter(Boolean).join('، ') || data.display_name;

                // 4. نعرض الاسم العربي على الشاشة أوتوماتيك
                cityNameDiv.innerText = fullAddress;

                // 5. نجهز الـ Payload للباكيند
                backendJsonDiv.innerText = JSON.stringify({
                    latitude: lat,
                    longitude: lon,
                    address: fullAddress
                }, null, 2);

            } catch (error) {
                cityNameDiv.innerText = "تم لقط الموقع، وفشل جلب الاسم العربي مؤقتاً";
            }
        },
        (error) => {
            // لو حصل مشكلة أو الإذن اترفض
            if (error.code === 1) {
                cityNameDiv.innerText = "❌ يرجى الضغط على 'سماح / Allow' للـ GPS ليظهر موقعك";
            } else {
                cityNameDiv.innerText = "❌ فشل لقط الـ GPS (تأكدي من تشغيل Location في الموبايل)";
            }
        },
        gpsOptions // تمرير الإعدادات الصارمة هنا
    );
}

// 🚀 تشغيل الدالة أوتوماتيك فور تحميل الصفحة
window.onload = getAutomaticLocation;
</script>

</body>
</html>
