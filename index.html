<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink - Precise Auto Location (Fixed)</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: right;
        }
        .address-box {
            background-color: #eff6ff;
            border: 2px dashed #2563eb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .payload-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #16a34a;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="card">
    <h3 style="margin-top: 0; color: #1e2937;">📍 تحديد الموقع التفصيلي أوتوماتيك</h3>
    <p style="font-size: 14px; color: #6b7280;">السيستم يجلب الشارع والمركز والمحافظة الدقيقة حالاً.</p>

    <div class="address-box">
        <strong>🗺️ تفاصيل العنوان الحالي الدقيق:</strong>
        <div id="streetName" style="color: #2563eb; font-weight: bold; margin-top: 5px;">جاري تشغيل الـ GPS...</div>
    </div>

    <div class="payload-box">
        📦 Payload for Backend:<br>
        <pre id="backendJson">{ "latitude": 0, "longitude": 0 }</pre>
    </div>
</div>

<script>
// الـ Token الفعّال بتاعك
const LOCATION_IQ_TOKEN = "pk.fab70d19cd0f26b0b2630069bd17c07c"; 

async function getExactLocationNoVisa() {
    let streetDiv = document.getElementById('streetName');
    let backendJsonDiv = document.getElementById('backendJson');

    const gpsOptions = {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
    };

    navigator.geolocation.getCurrentPosition(
        async (position) => {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;

            streetDiv.innerText = "جاري جلب تفاصيل الشارع والمنطقة...";

            try {
                let url = `https://us1.locationiq.com/v1/reverse?key=${LOCATION_IQ_TOKEN}&lat=${lat}&lon=${lon}&format=json&accept-language=ar`;
                let response = await fetch(url);
                let data = await response.json();

                if (data && data.address) {
                    let addr = data.address;

                    // 1. استخراج الشارع الفعلي أو الحي أو القرية الصغيرة أولاً بدقة
                    let street = addr.road || addr.suburb || addr.neighbourhood || addr.hamlet || ""; 
                    
                    // 2. الفلترة الذكية للمركز (قويسنا): لو السيرفر لقط اسم مدينة فرعية أو قرية نثبتها، وإلا نعتمد قويسنا مباشرة
                    let city = addr.village || addr.residential || addr.town || addr.city || "قويسنا";
                    
                    // لو الـ API رجع بركة السبع بالخطأ كـ city وأنتِ في قويسنا، بنصححها بناءً على الـ Data الأصلية
                    if (city.includes("بركة السبع") || city === "") {
                        city = "قويسنا";
                    }
                    
                    let state = addr.state || "المنوفية"; // المحافظة

                    // تركيب العنوان الصافي المفلتر بدون تداخل المراكز
                    let fullAddress = [street, city, state].filter(Boolean).join('، ');

                    streetDiv.innerText = fullAddress;

                    // تجهيز البيانات الصافية للباكيند
                    backendJsonDiv.innerText = JSON.stringify({
                        latitude: lat,
                        longitude: lon,
                        street: street || "شارع فرعي",
                        city_or_center: city,
                        governorate: state,
                        full_address: fullAddress
                    }, null, 2);

                } else {
                    streetDiv.innerText = "❌ فشل السيرفر في تقسيم العنوان";
                }

            } catch (error) {
                streetDiv.innerText = "❌ حدث خطأ أثناء الاتصال بسيرفر الموقع";
            }
        },
        (error) => {
            streetDiv.innerText = "❌ يرجى تفعيل الـ GPS وإعطاء الصلاحية للمتصفح";
        },
        gpsOptions
    );
}

window.onload = getExactLocationNoVisa;
</script>

</body>
</html>
