<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Mobile Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .result-box {
            margin-top: 20px;
            text-align: left;
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            display: none;
            word-break: break-word;
        }
        .status {
            margin-top: 15px;
            color: #4b5563;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Mobile GPS Tester 📱</h2>
    <p style="color: #6b7280; font-size: 14px;">Test your dynamic English location fetching.</p>
    
    <button id="getLocBtn">Get My Exact Location</button>
    
    <div id="status" class="status"></div>
    
    <div id="resultBox" class="result-box">
        <p><strong>Latitude:</strong> <span id="latText"></span></p>
        <p><strong>Longitude:</strong> <span id="lonText"></span></p>
        <p><strong>Location Name:</strong> <span id="nameText"></span></p>
    </div>
</div>

<script>
// دالة جلب الموقع الديناميكية اللي عملناها مع صلاحيات الـ GPS
function getFinalLocationWithPermission() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject("Geolocation is not supported by this browser.");
      return;
    }

    const geoOptions = {
      enableHighAccuracy: true,
      timeout: 40000,
      maximumAge: 0
    };

    async function fetchCoordinatesAndName() {
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          try {
            const response = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=en`
            );
            const data = await response.json();

            resolve({
              latitude: lat,
              longitude: lon,
              locationName: data.display_name || "Unknown Location"
            });
          } catch (error) {
            resolve({
              latitude: lat,
              longitude: lon,
              locationName: "Location name details currently unavailable"
            });
          }
        },
        (error) => {
          if (error.code === error.PERMISSION_DENIED) {
            reject("🚨 Please allow GPS permission in your phone browser settings.");
          } else {
            reject(`Geolocation Error: ${error.message}`);
          }
        },
        geoOptions
      );
    }

    if (navigator.permissions) {
      navigator.permissions.query({ name: 'geolocation' })
        .then((permissionStatus) => {
          if (permissionStatus.state === 'granted' || permissionStatus.state === 'prompt') {
            fetchCoordinatesAndName();
          } else if (permissionStatus.state === 'denied') {
            reject("🚨 Location access is Blocked! Check your browser site settings.");
          }
        })
        .catch(() => fetchCoordinatesAndName());
    } else {
      fetchCoordinatesAndName();
    }
  });
}

// ربط عناصر واجهة المستخدم بالكود
document.getElementById('getLocBtn').addEventListener('click', async () => {
    const statusDiv = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    
    statusDiv.innerText = "⏳ Requesting GPS access and fetching data...";
    resultBox.style.display = "none";
    
    try {
        const locationData = await getFinalLocationWithPermission();
        
        statusDiv.innerText = "✅ Location fetched successfully!";
        document.getElementById('latText').innerText = locationData.latitude;
        document.getElementById('lonText').innerText = locationData.longitude;
        document.getElementById('nameText').innerText = locationData.locationName;
        
        resultBox.style.display = "block";
    } catch (error) {
        statusDiv.innerText = "";
        alert(error);
    }
});
</script>

</body>
</html>
