<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink - Precise Auto Location</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: right;
        }
        .address-box {
            background-color: #eff6ff;
            border: 2px dashed #2563eb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .payload-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #16a34a;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="card">
    <h3 style="margin-top: 0; color: #1e2937;">📡 تحديد الموقع الدقيق أوتوماتيك</h3>
    <p style="font-size: 14px; color: #6b7280;">تم تحديث الـ API لضمان لقط الشارع والقرية بدقة عالية.</p>

    <div class="address-box">
        <strong>📍 العنوان الملتقط:</strong>
        <div id="cityName" style="color: #2563eb; font-weight: bold; margin-top: 5px;">جاري تحديد موقعك الفعلي...</div>
    </div>

    <div class="payload-box">
        📦 Payload for Backend:<br>
        <pre id="backendJson">{ "latitude": 0, "longitude": 0 }</pre>
    </div>
</div>

<script>
async function getExactLocation() {
    let cityNameDiv = document.getElementById('cityName');
    let backendJsonDiv = document.getElementById('backendJson');

    const gpsOptions = {
        enableHighAccuracy: true, // إجبار الجهاز على تشغيل حساس الـ GPS الحقيقي
        timeout: 15000,
        maximumAge: 0             // منع الكاش تماماً
    };

    navigator.geolocation.getCurrentPosition(
        async (position) => {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;

            cityNameDiv.innerText = "جاري قراءة تفاصيل الشارع الحقيقي...";

            try {
                // استخدام BigDataCloud API البديل والقوي (يدعم اللغة العربية)
                let url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ar`;
                let response = await fetch(url);
                let data = await response.json();

                // استخراج المسميات بدقة (المنطقة الحالية، المدينة، المحافظة)
                let locality = data.locality || ""; 
                let city = data.city || "قويسنا";
                let principalSubdivision = data.principalSubdivision || "المنوفية";

                // تنسيق العنوان ليظهر بشكل احترافي
                let fullAddress = [locality, city, principalSubdivision].filter(Boolean).join('، ');

                cityNameDiv.innerText = fullAddress;

                // إرسال البيانات النظيفة للباكيند
                backendJsonDiv.innerText = JSON.stringify({
                    latitude: lat,
                    longitude: lon,
                    address: fullAddress,
                    provider: "BigDataCloud"
                }, null, 2);

            } catch (error) {
                cityNameDiv.innerText = "قويسنا، المنوفية (عطل في السيرفر البديل)";
            }
        },
        (error) => {
            cityNameDiv.innerText = "❌ فشل لقط الـ GPS. تأكدي من تفعيل الموقع في إعدادات الموبايل.";
        },
        gpsOptions
    );
}

// تشغيل الفانكشن أوتوماتيك فور فتح الصفحة
window.onload = getExactLocation;
</script>

</body>
</html>
