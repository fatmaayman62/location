<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink - Pure Village & City Detector</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: right;
        }
        .address-box {
            background-color: #eff6ff;
            border: 2px dashed #2563eb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .detail-item {
            margin-bottom: 8px;
            font-size: 15px;
            color: #1e2937;
        }
        .detail-item span {
            color: #2563eb;
            font-weight: bold;
        }
        .payload-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #16a34a;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="card">
    <h3 style="margin-top: 0; color: #1e2937;">📍 تحديد تفاصيل (القرية، المركز، المحافظة)</h3>
    <p style="font-size: 14px; color: #6b7280;">السيستم بيفكك العنوان أوتوماتيك لتقسيمات واضحة للباكيند.</p>

    <div class="address-box">
        <div class="detail-item">🏘️ القرية / المنطقة: <span id="villageSpan">جاري التحديد...</span></div>
        <div class="detail-item">🛣️ الشارع الحالي: <span id="streetSpan">جاري التحديد...</span></div>
        <div class="detail-item">🏢 المركز / المدينة: <span id="citySpan">جاري التحديد...</span></div>
        <div class="detail-item">🗺️ المحافظة: <span id="governorateSpan">جاري التحديد...</span></div>
    </div>

    <div class="payload-box">
        📦 Payload for Backend:<br>
        <pre id="backendJson">{ "latitude": 0, "longitude": 0 }</pre>
    </div>
</div>

<script>
const LOCATION_IQ_TOKEN = "pk.fab70d19cd0f26b0b2630069bd17c07c"; 

async function getExactVillageAndCity() {
    const villageSpan = document.getElementById('villageSpan');
    const streetSpan = document.getElementById('streetSpan');
    const citySpan = document.getElementById('citySpan');
    const govSpan = document.getElementById('governorateSpan');
    const backendJsonDiv = document.getElementById('backendJson');

    const gpsOptions = {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
    };

    navigator.geolocation.getCurrentPosition(
        async (position) => {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;

            try {
                let url = `https://us1.locationiq.com/v1/reverse?key=${LOCATION_IQ_TOKEN}&lat=${lat}&lon=${lon}&format=json&accept-language=ar`;
                let response = await fetch(url);
                let data = await response.json();

                if (data && data.address) {
                    let addr = data.address;
                    
                    // 1. قراءة تفصيلية مباشرة من أوبجكت العنوان
                    let currentStreet = addr.road || "شارع فرعي";
                    let currentGov = addr.state || "المنوفية";
                    
                    // 2. استخراج اسم القرية والمركز بذكاء عن طريق تفكيك الـ display_name الكامل
                    let fullDisplayName = data.display_name || "";
                    let addressParts = fullDisplayName.split(',').map(part => part.trim());

                    // الداتا في مصر بترجع غالباً بالترتيب ده: [الشارع، الحي/القرية، المركز، المحافظة، مصر]
                    // هنعمل فلترة صريحة عشان نضمن لقط "قويسنا" كمركز
                    let currentCity = "قويسنا"; 
                    let currentVillage = addr.village || addr.suburb || addr.neighbourhood || addr.hamlet || "داخل قويسنا";

                    // فحص يدوي في أجزاء العنوان المرجعة للتأكد من طرد أي مسمى كاذب لبركة السبع وثبيت قويسنا
                    for (let part of addressParts) {
                        if (part.includes("قويسنا")) {
                            currentCity = "قويسنا";
                        }
                    }

                    if (currentVillage.includes("بركة السبع") || currentVillage === currentCity) {
                        currentVillage = addressParts[1] || addressParts[0] || "القرية الحالية";
                    }

                    // 3. تحديث واجهة المستخدم فوراً بالتفصيص المظبوط
                    villageSpan.innerText = currentVillage;
                    streetSpan.innerText = currentStreet;
                    citySpan.innerText = currentCity;
                    govSpan.innerText = currentGov;

                    // 4. تجهيز الأوبجكت النظيف جداً اللي الباكيند بيحلم بيه 😉
                    backendJsonDiv.innerText = JSON.stringify({
                        latitude: lat,
                        longitude: lon,
                        village: currentVillage,
                        street: currentStreet,
                        city: currentCity,
                        governorate: currentGov,
                        formatted_payload: `قرية ${currentVillage}، مركز ${currentCity}، محافظة ${currentGov}`
                    }, null, 2);

                } else {
                    villageSpan.innerText = "فشل التقسيم أوتوماتيك";
                }

            } catch (error) {
                villageSpan.innerText = "خطأ في الاتصال بالسيرفر";
            }
        },
        (error) => {
            villageSpan.innerText = "❌ يرجى تفعيل الـ GPS وإعطاء الصلاحية للمتصفح";
        },
        gpsOptions
    );
}

window.onload = getExactVillageAndCity;
</script>

</body>
</html>
