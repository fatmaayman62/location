<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink - Ultimate Location Picker</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: right;
        }
        .address-box {
            background-color: #eff6ff;
            border: 2px dashed #2563eb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .detail-item {
            margin-bottom: 10px;
            font-size: 15px;
            color: #1e2937;
        }
        .detail-item span {
            color: #2563eb;
            font-weight: bold;
        }
        .manual-section {
            background: #fff7ed;
            border: 1px solid #ffedd5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .payload-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #16a34a;
            direction: ltr;
            text-align: left;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h3 style="margin-top: 0; color: #1e2937;">📍 محدد الموقع الذكي المتكامل</h3>
    <p style="font-size: 14px; color: #6b7280;">السيستم يلقط الإحداثيات أوتوماتيك، ويسمح بتحديد القرية والشارع بدقة بالغة.</p>

    <div class="address-box">
        <div class="detail-item">🏢 المركز / المدينة: <span id="citySpan">قويسنا</span></div>
        <div class="detail-item">🗺️ المحافظة: <span id="governorateSpan">المنوفية</span></div>
        <div class="detail-item">🏘️ القرية / المنطقة الحاليّة: <span id="villageSpan">جاري التحديد...</span></div>
        <div class="detail-item">🛣️ الشارع: <span id="streetSpan">جاري التحديد...</span></div>
    </div>

    <div class="manual-section">
        <label style="font-weight: bold; color: #c2410c;">✍️ لتأكيد تفاصيل عنوانك بدقة:</label>
        
        <label for="villageSelect">اختر القرية / المنطقة:</label>
        <select id="villageSelect" onchange="updatePayloadFields()">
            <option value="الرمالي">الرمالي</option>
            <option value="مصطاي">مصطاي</option>
            <option value="طه شبرا">طه شبرا</option>
            <option value="أبنهس">أبنهس</option>
            <option value="قويسنا البلد">قويسنا البلد</option>
            <option value="المنشأة الكبرى">المنشأة الكبرى</option>
            <option value="بجيرم">بجيرم</option>
            <option value="ميت برة">ميت برة</option>
            <option value="وسط المدينة / قويسنا المحطة">وسط المدينة / قويسنا المحطة</option>
            <option value="أخرى">قرية أخرى...</option>
        </select>

        <label for="streetInput">اسم الشارع / علامة مميزة:</label>
        <input type="text" id="streetInput" placeholder="مثال: شارع المحطة، بجوار صيدلية..." oninput="updatePayloadFields()">
    </div>

    <div class="payload-box">
        📦 Payload for Backend:<br>
        <pre id="backendJson">{ "latitude": 0, "longitude": 0 }</pre>
    </div>
</div>

<script>
const LOCATION_IQ_TOKEN = "pk.fab70d19cd0f26b0b2630069bd17c07c"; 
let globalLat = 0;
let globalLon = 0;

async function autoDetectCoordinates() {
    const gpsOptions = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };

    navigator.geolocation.getCurrentPosition(
        async (position) => {
            globalLat = position.coords.latitude;
            globalLon = position.coords.longitude;

            try {
                let url = `https://us1.locationiq.com/v1/reverse?key=${LOCATION_IQ_TOKEN}&lat=${globalLat}&lon=${globalLon}&format=json&accept-language=ar`;
                let response = await fetch(url);
                let data = await response.json();

                if (data && data.address) {
                    let addr = data.address;
                    
                    // محاولة قراءة القرية والشارع أوتوماتيك لو الإشارة قوية
                    let detectedVillage = addr.village || addr.suburb || addr.neighbourhood || "";
                    let detectedStreet = addr.road || "";

                    if(detectedVillage && !detectedVillage.includes("بركة السبع")) {
                        document.getElementById('villageSpan').innerText = detectedVillage;
                        // تحديث الـ Select لو القرية المكتشفة موجودة فيه
                        document.getElementById('villageSelect').value = "أخرى";
                    } else {
                        document.getElementById('villageSpan').innerText = document.getElementById('villageSelect').value;
                    }

                    if(detectedStreet) {
                        document.getElementById('streetSpan').innerText = detectedStreet;
                        document.getElementById('streetInput').value = detectedStreet;
                    } else {
                        document.getElementById('streetSpan').innerText = "شارع فرعي";
                    }
                }
                updatePayloadFields();
            } catch (error) {
                updatePayloadFields();
            }
        },
        (error) => {
            document.getElementById('villageSpan').innerText = "تم حظر الـ GPS يدويًا";
            updatePayloadFields();
        },
        gpsOptions
    );
}

// فانكشن بتجمع البيانات الدقيقة (GPS + الاختيارات) وتعمل الـ Payload النضيف للباكيند
function updatePayloadFields() {
    let selectedVillage = document.getElementById('villageSelect').value;
    let typedStreet = document.getElementById('streetInput').value || "شارع فرعي";
    
    // تحديث العرض فوق
    document.getElementById('villageSpan').innerText = selectedVillage;
    document.getElementById('streetSpan').innerText = typedStreet;

    // تجهيز الـ JSON الاحترافي للباكيند
    document.getElementById('backendJson').innerText = JSON.stringify({
        latitude: globalLat,
        longitude: globalLon,
        governorate: "المنوفية",
        city: "قويسنا",
        village: selectedVillage,
        street: typedStreet,
        formatted_address: `قرية ${selectedVillage}، شارع ${typedStreet}، مركز قويسنا، محافظة المنوفية`
    }, null, 2);
}

// التفعيل التلقائي
window.onload = autoDetectCoordinates;
</script>

</body>
</html>
